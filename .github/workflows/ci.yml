name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    name: Validate manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check manifest.json is valid JSON
        run: jq empty manifest.json
      - name: Check files referenced by manifest.json exist
        run: |
          missing=0
          for f in $(jq -r '[.icons[]?, .action.default_icon?, .background.service_worker?, .content_scripts[]?.js[]?] | map(select(type == "string")) | unique[]' manifest.json); do
            if [ ! -f "$f" ]; then
              echo "::error file=manifest.json::Missing file: $f"
              missing=1
            fi
          done
          exit "$missing"
